# Optional override. Base docker-compose.yml now treats the database as external
# and injects DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME from .env.
# Use this file only if you need to override specific env vars (e.g. a different .env).

services:
  backend:
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
